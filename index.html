      const yy=Math.round(it.transform[5]),x=it.transform[4];
      if(y!==null&&Math.abs(yy-y)>3){out+=line.trim()+"\n";line="";end=null}
      if(end!==null&&x-end>1&&!line.endsWith(" ")&&!it.str.startsWith(" "))line+=" ";
      line+=it.str;y=yy;end=x+it.width;
    }
    out+=line.trim()+"\n";
  }
  return out;
}

let iv=null;

const stHTML=()=>({kirim:"Mengirim nilai ke guru...",ok:"✓ Nilai sudah terkirim ke guru.",pratinjau:"Pratinjau: nilai tidak dikirim.",gagal:'Nilai gagal terkirim. <button id="rt">Kirim Ulang</button>'}[hasil.st]);

function selesai(paksa){

function konfeti(n){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const w=["#ffd93d","#ff90e8","#6bc5ff","#7ae582","#ff6b6b"];
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="conf";d.style.left=Math.random()*100+"vw";d.style.background=w[i%w.length];d.style.animationDuration=(2+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),6500)}
}

  app.innerHTML=`<div id="nt"></div><div class="c"><h2>Hasil &amp; Peringkat (<span id="hc">0</span>)</h2><br><button class="bl" id="xl">Unduh Spreadsheet</button><button class="g" id="rf">Muat Ulang</button>${"Notification" in window&&Notification.permission==="default"?'<button class="g" id="nf">🔔 Aktifkan Notifikasi Browser</button>':""}<button class="r" id="hp">Hapus Semua</button><div id="rk"></div><div id="hb"></div></div>
  <div class="c"><h2>Pengaturan Kuis</h2><br><label class="mu">Judul / nama kuis (tampil di halaman siswa)</label><input id="jj" value="${esc(D.judul)}" placeholder="mis. Kuis Teknologi Web"><label class="mu">Nama materi yang dikerjakan (tampil di halaman siswa)</label><input id="tpk" value="${esc(D.topik)}" placeholder="mis. Dasar-dasar Jaringan Komputer"><label class="mu">Keterangan untuk siswa (opsional)</label><textarea id="inf" rows="3" placeholder="mis. Pilih jawaban yang paling tepat.">${esc(D.info)}</textarea><label class="mu">Timer kuis dalam menit (isi 0 jika tanpa timer)</label><input id="mnt" type="number" min="0" max="300" value="${D.menit||0}"><button id="sv0" class="bl">Simpan Soal Kuis</button></div>
  <div class="c"><h2>Materi (${D.materi.length})</h2><br><select id="jml"><option value="10">Jika format soal tak terdeteksi: buat 10 soal isian</option><option value="20">Jika tak terdeteksi: buat 20 soal isian</option><option value="30">Jika tak terdeteksi: buat 30 soal isian</option><option value="50">Jika tak terdeteksi: buat 50 soal isian</option><option value="0">Hanya simpan materi (jangan impor soal)</option></select><input type="file" id="fl" accept=".docx,.pdf,.txt,.md"><p class="mu">.docx, .pdf, .txt, .md. Materi hanya untuk guru. Soal bernomor dengan pilihan a–d dan kunci jawaban di dokumen diambil persis seperti aslinya. Jika format tidak terdeteksi, dibuat soal isian rumpang.</p><p class="mu"><b>${esc(ket)}</b></p>${D.materi.map((m,i)=>`<div class="top"><span>${esc(m.judul)}</span><span><button class="g" data-g="${i}">Impor Soal dari Dokumen</button><button class="r" data-m="${i}">Hapus</button></span></div>`).join("")}</div>

  $("#fl").onchange=async e=>{const f=e.target.files[0];if(!f)return;let t="";ambilForm();
